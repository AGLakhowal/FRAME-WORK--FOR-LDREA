<circle cx="922" cy="230" r="11" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<text x="940" y="234" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#111111" text-anchor="start">always-on plane (4)</text>
