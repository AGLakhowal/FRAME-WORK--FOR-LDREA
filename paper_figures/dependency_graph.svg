<text x="942" y="265" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#111111" text-anchor="start">depends on</text>
<text x="910" y="302" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#111111" font-weight="bold" text-anchor="start">execution order</text>
<text x="910" y="320" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">PE -&gt; RV -&gt; EQ -&gt; LG -&gt; HC -&gt;</text>
<text x="910" y="334" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">WD -&gt; FT -&gt; CK -&gt; RD</text>
<text x="910" y="358" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">9 components discovered</text>
<text x="24" y="860" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">Discovery method: importlib + inspect probing of live runtime symbols; a component is listed only if its symbol resolves.</text>
<text x="24" y="872" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">The dependency structure explains the interaction matrix: HC depends on LG and EQ, and LG depends on EQ, so removing EQ</text>
<text x="24" y="884" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">already destroys the ledger and hash-chain planes -- which is why the EQ+LG and EQ+HC pairs read as Critical Dependency,</text>
<text x="24" y="896" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">not as additive damage.</text>
</svg>
