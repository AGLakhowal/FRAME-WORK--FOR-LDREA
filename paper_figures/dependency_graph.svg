<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="start">Component dependency DAG (discovered from the live runtime)</text>
<text x="24" y="51" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="start">Edge A -&gt; B means A CONSUMES B (A depends on B).  Columns are topological depth: a component sits to the right of everything it depends on.</text>
