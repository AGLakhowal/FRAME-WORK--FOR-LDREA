<text x="24" y="520" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">Note: no configuration in the ablation matrix removes exactly 4 component(s), so that abscissa has no data and the lines interpolate across it.</text>
