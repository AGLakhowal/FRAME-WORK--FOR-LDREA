<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="start">Threshold sensitivity: conclusions are STABLE under +/-20% threshold perturbation</text>
<text x="24" y="51" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="start">Every ablation conclusion holds at every threshold scale. Cell = runtime integrity score (colour + top line); undetected-risk rate (URR) below it.</text>
<text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">30 executions = 6 configurations x 5 threshold scales; 4 stability checks evaluated at every scale.</text>
