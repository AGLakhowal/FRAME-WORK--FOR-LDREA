<text x="24" y="686" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">RIS is audit-weighted by construction: four of the six planes are audit/provenance planes, so a purely</text>
<text x="24" y="698" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">security-degrading ablation (e.g. removing revocation) costs less RIS than an evidence-plane ablation.</text>
<text x="24" y="710" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">The verdict colour, not the bar length alone, carries the security interpretation.</text>
