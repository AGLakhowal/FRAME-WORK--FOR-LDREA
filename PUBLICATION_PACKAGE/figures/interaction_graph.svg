<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="start">Pairwise component interaction matrix</text>
<text x="24" y="51" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#555555" text-anchor="start">Cell = interaction effect (observed degradation - additive prediction) for removing both components; colour = interaction class.</text>
<text x="24" y="72" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">effect &lt; 0 -&gt; the pair degrades LESS than the sum of its parts (shared / saturated plane); effect = 0 -&gt; exactly additive.</text>
