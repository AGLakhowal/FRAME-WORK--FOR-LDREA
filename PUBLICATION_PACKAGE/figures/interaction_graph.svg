<rect x="652" y="188" width="13" height="13" fill="#cc79a7"/>
<text x="671" y="199" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#bdbdbd" text-anchor="start">Redundant (saturated)</text>
<text x="671" y="208" font-family="Helvetica, Arial, sans-serif" font-size="6.8" fill="#bdbdbd" text-anchor="start">(not observed at order 2)</text>
<rect x="652" y="208" width="13" height="13" fill="#009e73"/>
<text x="671" y="219" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#bdbdbd" text-anchor="start">Synergistic</text>
<text x="671" y="228" font-family="Helvetica, Arial, sans-serif" font-size="6.8" fill="#bdbdbd" text-anchor="start">(not observed at order 2)</text>
<text x="24" y="470" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">10 distinct component pairs (matrix is symmetric; diagonal is undefined).</text>
<text x="24" y="482" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">Components: PE predicate engine, RV runtime revocation, EQ evidence quad, LG runtime ledger, HC hash chain.</text>
<text x="24" y="494" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">A &apos;Critical Dependency&apos; cell means the two components share a plane, so the second removal costs almost nothing extra --</text>
<text x="24" y="506" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#555555" text-anchor="start">the damage was already done by the first.</text>
