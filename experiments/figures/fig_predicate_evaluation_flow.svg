<text x="60" y="698" font-size="14" font-weight="bold" fill="#1a2333">How to read a predicate result</text>
<rect x="60" y="715" width="14" height="14" rx="3" fill="#1f7a4d"/>
<text x="84" y="726" font-size="12.5" font-weight="bold" fill="#1a2333">PASS, expected PASS</text>
<text x="250" y="726" font-size="12.5" fill="#5b6a80">Condition satisfied. Correct.</text>
<rect x="60" y="745" width="14" height="14" rx="3" fill="#1d4f9c"/>
<text x="84" y="756" font-size="12.5" font-weight="bold" fill="#1a2333">FAIL, expected FAIL</text>
<text x="250" y="756" font-size="12.5" fill="#5b6a80">Condition intentionally rejected. Correct — a detection.</text>
<rect x="60" y="775" width="14" height="14" rx="3" fill="#a3202f"/>
<text x="84" y="786" font-size="12.5" font-weight="bold" fill="#1a2333">FAIL, expected PASS</text>
<text x="250" y="786" font-size="12.5" fill="#5b6a80">Observed ≠ expected. Implementation error.</text>
<rect x="60" y="805" width="14" height="14" rx="3" fill="#a3202f"/>
<text x="84" y="816" font-size="12.5" font-weight="bold" fill="#1a2333">PASS, expected FAIL</text>
<text x="250" y="816" font-size="12.5" fill="#5b6a80">Observed ≠ expected. Implementation error — a false permit.</text>
<text x="60" y="852" font-size="11.5" fill="#5b6a80">A predicate FAIL is not a software failure. In an adversarial scenario it is the specified behaviour.</text>
<text x="440.0" y="974" font-size="11" text-anchor="middle" fill="#5b6a80">L-DREA Gamma G-0 &#183; presentation artifact &#183; no experimental result is derived from this figure</text>
